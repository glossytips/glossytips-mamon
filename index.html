<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glossy Tips by Arpita Patra | Certified Nail Artist in Patuli, Kolkata</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #FFFDF9;
            --bg-secondary: #F8E8EE;
            --accent-soft: #FFD6E8;
            --accent-rose: #E0A0A0;
            --accent-hover: #F2A9C4;
            --text-dark: #2B2129;
            --text-muted: #6B5B68;
            --card-bg: #FFFFFF;
            --border-color: #F0D5E1;
            --shadow-soft: 0 6px 18px rgba(224, 160, 160, 0.1);
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
            color: var(--text-dark);
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ================= NAVIGATION ================= */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 253, 249, 0.98);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 0.7rem 4%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            flex-direction: column;
        }

        .logo-title {
            font-size: 1.15rem;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
        }

        .logo-subtitle {
            font-size: 0.6rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 1rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            font-weight: 500;
            font-size: 0.8rem;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent-rose);
        }

        .btn-wp {
            background: #25D366;
            color: #FFF !important;
            padding: 0.4rem 0.8rem;
            border-radius: 50px;
            font-weight: 600 !important;
            font-size: 0.78rem;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
        }

        .menu-toggle {
            display: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-dark);
            background: none;
            border: none;
            padding: 5px;
        }

        @media (max-width: 1024px) {
            .menu-toggle {
                display: block !important;
            }
            .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: var(--card-bg);
                flex-direction: column;
                align-items: center;
                padding: 1.5rem 0;
                border-bottom: 1px solid var(--border-color);
                box-shadow: var(--shadow-soft);
                display: none;
                gap: 1.2rem;
            }
            .nav-links.active {
                display: flex !important;
            }
        }

        /* ================= HERO ================= */
        .hero {
            padding: 3rem 5% 2.5rem;
            background: linear-gradient(135deg, var(--bg-main) 0%, var(--bg-secondary) 100%);
            text-align: center;
        }

        .hero-badge {
            display: inline-block;
            background: var(--accent-soft);
            color: var(--text-dark);
            padding: 0.35rem 1.1rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.9rem;
            border: 1px solid var(--border-color);
        }

        .hero h1 {
            font-size: 2rem;
            margin-bottom: 0.9rem;
            line-height: 1.2;
        }

        .hero p {
            max-width: 550px;
            margin: 0 auto 1.5rem;
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 0.9rem;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: var(--accent-soft);
            color: var(--text-dark);
            padding: 0.7rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid var(--accent-rose);
            transition: all 0.3s;
            box-shadow: var(--shadow-soft);
            display: inline-block;
            text-align: center;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #FFF;
            color: var(--text-dark);
            padding: 0.7rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid var(--border-color);
        }

        /* ================= SECTIONS ================= */
        section {
            padding: 3rem 5%;
        }

        .section-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .section-header h2 {
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* TRUST BADGES */
        .trust-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
        }

        .trust-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.3rem 0.9rem;
            text-align: center;
            box-shadow: var(--shadow-soft);
        }

        .trust-card i {
            font-size: 1.5rem;
            color: var(--text-dark);
            background: var(--bg-secondary);
            width: 45px;
            height: 45px;
            line-height: 45px;
            border-radius: 50%;
            margin-bottom: 0.7rem;
        }

        .trust-card h3 { font-size: 0.9rem; margin-bottom: 0.25rem; }
        .trust-card p { font-size: 0.75rem; color: var(--text-muted); }

        /* SERVICES & COMBOS */
        .combo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.2rem;
        }

        .combo-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.6rem;
            position: relative;
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .combo-card.popular {
            border-color: var(--accent-rose);
            background: linear-gradient(180deg, #FFFFFF 0%, var(--bg-secondary) 100%);
        }

        .popular-badge {
            position: absolute;
            top: -10px;
            right: 20px;
            background: var(--accent-rose);
            color: #FFF;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .combo-card h3 { font-size: 1.15rem; margin-bottom: 0.3rem; }
        .combo-price { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.9rem; }

        .combo-features {
            list-style: none;
            margin-bottom: 1.2rem;
        }

        .combo-features li {
            font-size: 0.8rem;
            margin-bottom: 0.35rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .combo-features li i { color: #25D366; }

            border: 1px solid var(--border-color);
